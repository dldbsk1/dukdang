spring:
  datasource:
    url: jdbc:mysql://localhost:3306/dukdangdb?useSSL=false&serverTimezone=Asia/Seoul
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

gemini:
  api-key: ${GEMINI_API_KEY}
  model: gemini-2.5-flash

jwt:
  secret: bXlTZWNyZXRLZXlGb3JKV1RUb2tlbkdlfadsfbmVyYXRpb24xMjM0NTY=
  expiration: 86400000

springdoc:
  swagger-ui:
    path: /swagger-ui.html